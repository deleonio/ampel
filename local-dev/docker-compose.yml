# Lokale AMPEL-Entwicklungsumgebung. Start: docker compose up -d --build
name: ampel-local

x-db-env: &db-env
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_USERNAME: ampel
  DATABASE_PASSWORD: ampel
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092

x-backend: &backend
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    kafka-init: { condition: service_completed_successfully }

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ampel
      POSTGRES_PASSWORD: ampel
    ports: ["15432:5432"]
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ampel"]
      interval: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      retries: 30

  kafka-init:
    image: apache/kafka:4.1.1
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in ampel scoring-service-dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 1 --replication-factor 1
        done

  mailpit:
    image: axllent/mailpit:latest
    ports: ["18025:8025"]

  metainformation-service:
    <<: *backend
    build: { context: .., dockerfile: local-dev/Dockerfile.backend, args: { SERVICE: metainformation-service } }
    image: ampel-metainformation-service:local
    environment:
      <<: *db-env
      DATABASE_NAME: metainformation

  scoring-service:
    <<: *backend
    build: { context: .., dockerfile: local-dev/Dockerfile.backend, args: { SERVICE: scoring-service } }
    image: ampel-scoring-service:local
    environment:
      <<: *db-env
      DATABASE_NAME: scoring

  notification-service:
    <<: *backend
    build: { context: .., dockerfile: local-dev/Dockerfile.backend, args: { SERVICE: notification-service } }
    image: ampel-notification-service:local
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
    environment:
      <<: *db-env
      DATABASE_NAME: notification
      MAIL_BASE_HOST: mailpit
      MAIL_BASE_PORT: "1025"
      MAIL_BASE_USERNAME: ""
      MAIL_BASE_PASSWORD: ""
      MAIL_BASE_SENDER_ADDRESS: ampel@localhost
      MAIL_BASE_RECIPIENT_ADDRESS: station@localhost
      TEMPLATE_LOCATION_ROOT_DIR: /opt/templates
      LABORATORY_SCORE_MAIL_SUBJECT_TEMPLATE_PATH: laboratory-score/subject.jte
      LABORATORY_SCORE_MAIL_BODY_TEMPLATE_PATH: laboratory-score/body.jte
    volumes:
      - ./templates:/opt/templates:ro

  api:
    image: caddy:2-alpine
    depends_on: [metainformation-service, scoring-service]
    ports: ["18080:8080"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  ui:
    build: { context: ../ui, dockerfile: docker/Dockerfile }
    image: ampel-ui:local
    depends_on: [api]
    ports: ["3003:3003"]
    environment:
      BASE_API_URL: http://api:8080
      HEADER_PRODUCT_LOGO_URL: assets/brand-default-logo.svg
      HEADER_CLINIC_LOGO_URL: assets/clinical-default-logo.svg
      TZ: Europe/Berlin

volumes:
  pgdata:
